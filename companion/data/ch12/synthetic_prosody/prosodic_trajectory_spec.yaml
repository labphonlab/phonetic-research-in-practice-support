schema_version: '0.1'
data_status: SYNTHETIC_TEACHING_FIXTURE
trajectory:
  trajectory_id: SYN_F0_CONTOUR
  construct: instructional phrase-level F0 contour
  acoustic_measure: selected_f0_hz
  raw_unit: Hz
  analysis_unit: semitones_relative_to_training_speaker_median
domain:
  annotation_tier: synthetic_phrase
  included_labels:
  - synthetic_phrase
  start_landmark: interval_start_s
  end_landmark: interval_end_s
  alignment_landmark: fixed_delay_event
frame_grid:
  source_step_ms: 10
  requested_grid_rule: every 10 ms from inclusive onset while <= interval end
  retain_absolute_time: true
  retain_landmark_relative_time: true
  retain_proportional_time: true
estimation:
  software: synthetic generator
  software_version: '0.1'
  algorithm: generated AR(1)-noise contour
  settings_profile_id: SYN_PROFILE
  settings:
    seed: 12042026
missingness:
  required_codes:
  - structural_unvoiced
  - estimator_failure
  - quality_rejection
  - source_failure
  preserve_requested_frames: true
preprocessing:
  correction_policy: none
  interpolation_permitted: true
  interpolation_max_gap_ms: 20
  interpolation_eligible_codes:
  - estimator_failure
  smoothing_method: model-based only
  smoothing_parameters: {}
scaling:
  transformation: 12*log2(f0/speaker_observed_median)
  reference_sample_id: all observed synthetic frames by speaker
  reference_definition: observed, non-rejected frames only
  reference_unit: speaker
  interpretive_limit: not a biological normalization claim
time_representation:
  primary: proportional
  sensitivity_representations:
  - real
  - landmark_relative
  resampling_method: none in preparation; model uses observed grid
  target_grid: 0 to 1 by .02 for predictions
dependence:
  speaker_id: speaker_id
  item_id: item_id
  token_id: token_id
  series_start_variable: series_start
  frame_order_variable: frame_index
  residual_structure: AR1 rho=0.6 prespecified for teaching comparison
quality_control:
  track_flags:
  - reason-coded gap
  - interpolated value
  risk_strata:
  - condition_id
  - duration
  review_sample_rule: all non-observed frames
  contribution_count_required: true
gate:
  coverage_rule: report contribution counts at every prediction point
  stability_rule: condition contrast direction must agree across time representations
  permitted_decisions:
  - accept
  - restrict
  - amend_and_rerun
  - reject
provenance:
  source_hash_required: true
  retain_raw_frames: true
  overwrite_permitted: false
