  post_result_branches_label: "exploratory"
outputs:
  result_table: "specification_results.tsv"
  failure_table: "specification_failures.tsv"
  stability_table: "claim_stability.tsv"
  conclusion_map: "conclusion_map.yaml"
provenance:
  input_hashes_required: true
  configuration_hashes_required: true
  overwrite_permitted: false
