<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330"><style>text{font-family:sans-serif;font-size:14px}.small{font-size:12px}</style><rect x="330" y="25" width="240" height="55" rx="8" fill="#e9f2fb" stroke="#345"/><text x="450" y="58" text-anchor="middle">1,296 observations</text><line x1="400" y1="80" x2="225" y2="145" stroke="#527a9b"/><line x1="500" y1="80" x2="675" y2="145" stroke="#527a9b"/><rect x="105" y="145" width="240" height="55" rx="8" fill="#e8f5e9" stroke="#345"/><text x="225" y="178" text-anchor="middle">24 speakers: random effects</text><rect x="555" y="145" width="240" height="55" rx="8" fill="#fff3cd" stroke="#345"/><text x="675" y="178" text-anchor="middle">18 items: fixed blocking effects</text><text x="450" y="250" text-anchor="middle">Conceptual design: crossed speakers × items</text><text class="small" x="450" y="280" text-anchor="middle">Implementation limit: nlme model does not estimate crossed item random effects here.</text><text class="small" x="450" y="305" text-anchor="middle">Therefore new-speaker inference may be considered; new-item inference is prohibited.</text></svg>
