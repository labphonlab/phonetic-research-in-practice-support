name: companion-validation

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  local-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::jsonlite
            any::mgcv
            any::nlme
            any::rmarkdown
            any::yaml
      - run: python -m pip install -r companion/requirements-python.txt
      - run: python companion/scripts/validate_notebook_portability.py
      - run: companion/scripts/validate_implemented_companions.sh
